# PR source code must never run on the credential-bearing runner.
name: Deploy PR preview
'on':
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: read
concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24
    - name: Verify committed release assets
      shell: pwsh
      run: |
        $model = './models/TinyCLIP-ViT-8M-16-Text-3M-YFCC15M-ONNX/onnx/vision_model_quantized.onnx'
        $labels = './data/fixed-label-embeddings.tinyclip-int8.generated.json'
        if (!(Test-Path $model)) { throw 'Committed release ONNX is missing' }
        if (!(Test-Path $labels)) { throw 'Committed label embeddings are missing' }
        $sha = (Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($sha -ne 'bbf8426b0e548881dcfd9257030dd6139fceeeb4808994968b882ecc3ada291f') {
          throw "Release model SHA mismatch: $sha"
        }
    - name: Fetch pinned runtime assets
      shell: pwsh
      run: ./tools/setup-assets.ps1
    - name: Build standalone HTML
      shell: pwsh
      run: ./tools/build-standalone.ps1 -OutputPath ./dist/index.html
    - name: Verify generated artifact
      shell: pwsh
      run: |
        if (!(Test-Path ./dist/index.html)) { throw 'dist/index.html was not generated' }
        $html = Get-Content -Raw ./dist/index.html
        if ($html -notmatch 'connect-src blob:') { throw 'embedded Blob fetch CSP is missing' }
        if ($html -notmatch "'wasm-unsafe-eval'") { throw 'WASM CSP permission is missing' }
        if ($html -match 'connect-src[^;]*(https?:|\*)') { throw 'external runtime network access must remain blocked' }
        $buildPlaceholders = @(
          '__APP_CONFIG_JSON__',
          '__BUILD_MANIFEST_JSON__',
          '__EMBEDDED_ASSET_BUNDLE_JSON__',
          '__FIXED_CATEGORY_CATALOG_JSON__',
          '__ACCURACY_REGRESSION_CONFIG_JSON__'
        )
        $remainingPlaceholders = @($buildPlaceholders | Where-Object { $html.Contains($_) })
        if ($remainingPlaceholders.Count -gt 0) {
          throw "unresolved build placeholder remains: $($remainingPlaceholders -join ', ')"
        }
        if ($html -notmatch 'v1\.0\.5') { throw 'release version is missing from generated HTML' }
        node ./tests/visual-assets.test.mjs
        if ($LASTEXITCODE -ne 0) { throw "Visual asset regression failed." }
        node ./tests/header-normalization.test.mjs src/index.template.html dist/index.html
        if ($LASTEXITCODE -ne 0) { throw "Header normalization regression failed." }
        node ./tests/help-dialog.test.cjs src/index.template.html dist/index.html
        if ($LASTEXITCODE -ne 0) { throw "Help dialog regression failed." }
        $env:SORTER_HTML = './dist/index.html'
        node --test ./tests/result-workflow.test.cjs
        if ($LASTEXITCODE -ne 0) { throw "Results workflow regression failed." }
        Remove-Item Env:SORTER_HTML
        New-Item -ItemType File -Force -Path ./dist/.nojekyll | Out-Null
        Write-Host "Standalone size: $([math]::Round((Get-Item ./dist/index.html).Length / 1MB, 1)) MB"
    - name: Verify mobile source contract
      shell: pwsh
      run: |
        node --test tests/mobile-footer.test.cjs
        if ($LASTEXITCODE -ne 0) { throw "Footer source regression failed." }
    - name: Verify footer and Help in Chromium
      shell: pwsh
      run: |
        $testTools = Join-Path $env:RUNNER_TEMP "mobile-footer-tests"
        npm install --prefix $testTools --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.58.2
        if ($LASTEXITCODE -ne 0) { throw "Playwright installation failed." }
        $env:NODE_PATH = Join-Path $testTools "node_modules"
        & (Join-Path $testTools "node_modules/.bin/playwright.cmd") install chromium
        if ($LASTEXITCODE -ne 0) { throw "Chromium installation failed." }
        New-Item -ItemType Directory -Force -Path test-results/mobile-footer | Out-Null
        node scripts/mobile-footer.browser.cjs 2>&1 | Tee-Object -FilePath test-results/mobile-footer/results.log
        if ($LASTEXITCODE -ne 0) { throw "Footer browser regression failed." }
    - name: Upload footer browser evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: mobile-footer-browser-evidence
        path: test-results/mobile-footer/
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload static preview site
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pr-preview-site
        path: dist/
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
        include-hidden-files: true
    permissions:
      contents: read
