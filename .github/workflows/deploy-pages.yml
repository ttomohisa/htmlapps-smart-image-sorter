name: Deploy standalone app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      pages-ready: ${{ steps.pages-status.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Verify committed release assets
        shell: pwsh
        run: |
          $model = './models/TinyCLIP-ViT-8M-16-Text-3M-YFCC15M-ONNX/onnx/vision_model_quantized.onnx'
          $labels = './data/fixed-label-embeddings.tinyclip-int8.generated.json'
          if (!(Test-Path $model)) { throw 'Committed release ONNX is missing' }
          if (!(Test-Path $labels)) { throw 'Committed label embeddings are missing' }
          $sha = (Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'bbf8426b0e548881dcfd9257030dd6139fceeeb4808994968b882ecc3ada291f') { throw "Release model SHA mismatch: $sha" }

      - name: Fetch pinned runtime assets
        shell: pwsh
        run: ./tools/setup-assets.ps1

      - name: Build standalone HTML for Pages
        shell: pwsh
        run: ./tools/build-standalone.ps1 -OutputPath ./dist/index.html

      - name: Verify generated Pages artifact
        shell: pwsh
        run: |
          if (!(Test-Path ./dist/index.html)) { throw 'dist/index.html was not generated' }
          $html = Get-Content -Raw ./dist/index.html
          if ($html -notmatch 'connect-src blob:') { throw 'embedded Blob fetch CSP is missing' }
          if ($html -notmatch "'wasm-unsafe-eval'") { throw 'WASM CSP permission is missing' }
          if ($html -match 'connect-src[^;]*(https?:|\*)') { throw 'external runtime network access must remain blocked' }
          if ($html -match '__[A-Z0-9_]+__') { throw 'unresolved build placeholder remains' }
          if ($html -notmatch 'v1\.0\.0') { throw 'release version is missing from generated HTML' }
          New-Item -ItemType File -Force -Path ./dist/.nojekyll | Out-Null
          Write-Host "Standalone size: $([math]::Round((Get-Item ./dist/index.html).Length / 1MB, 1)) MB"

      - name: Check whether GitHub Pages is enabled
        id: pages-status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/pages" --silent 2>$null

          if ($LASTEXITCODE -eq 0) {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "GitHub Pages is enabled. The deployment will continue."
            exit 0
          }

          "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          @"
          ## GitHub Pages is not enabled yet

          The standalone HTML was built successfully, but deployment was skipped.

          1. Open **Settings → Pages** in this repository.
          2. Under **Build and deployment**, set **Source** to **GitHub Actions**.
          3. Re-run this workflow.

          This is a one-time repository setting.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          exit 0

      - name: Configure GitHub Pages
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v7
        with:
          name: smart-image-sorter-${{ github.sha }}
          path: |
            dist/index.html
            dist/build-metrics.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: needs.build.outputs.pages-ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
